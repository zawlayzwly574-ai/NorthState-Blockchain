openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Live crypto market data
  - name: portfolio
    description: User portfolio and activity
  - name: wallet
    description: Wallet actions and verification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /markets:
    get:
      operationId: getMarketSummary
      tags: [markets]
      summary: Get live market summary
      description: Returns a curated list of supported assets with current market data.
      responses:
        "200":
          description: Market summary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketAsset"
  /markets/fx-rates:
    get:
      operationId: getFxRates
      tags: [markets]
      summary: Get USD-based fiat exchange rates
      responses:
        "200":
          description: Exchange rates keyed by currency code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRates"
  /mining-place:
    get:
      operationId: getMiningPlace
      tags: [markets]
      summary: Get real-world asset benchmark quotes
      description: Returns cached public quotes for commodities, sectors, oil, and major stocks.
      responses:
        "200":
          description: Mining Place benchmark quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MiningPlaceSummary"
  /mining-investments:
    get:
      operationId: getMiningInvestments
      tags: [portfolio]
      summary: List the signed-in user's Mining Place investments
      responses:
        "200":
          description: Investment list and available USDC
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiningInvestmentList" }
    post:
      operationId: createMiningInvestment
      tags: [portfolio]
      summary: Submit a Mining Place investment request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMiningInvestmentInput" }
      responses:
        "201":
          description: Pending investment request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiningInvestment" }
  /markets/{symbol}:
    get:
      operationId: getMarketDetail
      tags: [markets]
      summary: Get a market detail
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Market detail with chart points
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDetail"
        "404":
          description: Asset not found
  /profile:
    get:
      operationId: getProfile
      tags: [portfolio]
      summary: Get the signed-in profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      tags: [portfolio]
      summary: Update profile display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileUpdateResult"
  /security/totp/setup:
    post:
      operationId: setupTotp
      tags: [security]
      summary: Generate a new TOTP secret pending verification
      responses:
        "200":
          description: TOTP setup data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetupResult" }
  /security/totp/verify:
    post:
      operationId: verifyTotp
      tags: [security]
      summary: Verify TOTP code and activate 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpVerifyInput" }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityActionResult" }
  /security/totp:
    delete:
      operationId: disableTotp
      tags: [security]
      summary: Disable 2FA for the current user
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityActionResult" }
  /security/passkeys:
    get:
      operationId: listPasskeys
      tags: [security]
      summary: List registered passkeys for current user
      responses:
        "200":
          description: Passkey list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PasskeyItem" }
  /security/passkeys/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [security]
      summary: Generate WebAuthn registration challenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyBeginInput" }
      responses:
        "200":
          description: Registration challenge and options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyBeginResult" }
  /security/passkeys/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [security]
      summary: Complete WebAuthn registration and store passkey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyFinishInput" }
      responses:
        "200":
          description: Registered passkey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyItem" }
  /sms/send-otp:
    post:
      operationId: sendSmsOtp
      tags: [security]
      summary: Send a 6-digit OTP via SMS to the given phone number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSmsOtpInput" }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendSmsOtpResult" }
  /sms/verify-otp:
    post:
      operationId: verifySmsOtp
      tags: [security]
      summary: Verify the OTP code against the one sent to the phone number
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifySmsOtpInput" }
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifySmsOtpResult" }
  /security/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [security]
      summary: Remove a registered passkey
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityActionResult" }
  /notifications:
    get:
      operationId: getNotifications
      tags: [portfolio]
      summary: Get recent activity notifications
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get portfolio balances
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
  /activity:
    get:
      operationId: getActivity
      tags: [portfolio]
      summary: Get recent wallet activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /referral:
    get:
      operationId: getReferral
      tags: [portfolio]
      summary: Get referral code and sharing stats
      responses:
        "200":
          description: Referral information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
    post:
      operationId: createReferralShare
      tags: [portfolio]
      summary: Record a referral share
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralShareInput"
      responses:
        "201":
          description: Share recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Referral"
  /kyc:
    post:
      operationId: submitKyc
      tags: [wallet]
      summary: Submit identity verification details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycInput"
      responses:
        "201":
          description: KYC submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatus"
  /transactions/swap:
    post:
      operationId: createSwap
      tags: [wallet]
      summary: Instantly convert one crypto asset to another
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwapInput"
      responses:
        "200":
          description: Swap executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwapResult"
        "400":
          description: Insufficient balance or invalid assets
  /transactions/deposit:
    post:
      operationId: createDeposit
      tags: [wallet]
      summary: Submit a deposit proof
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Deposit submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/send:
    post:
      operationId: createSend
      tags: [wallet]
      summary: Create a send transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /transactions/withdraw:
    post:
      operationId: createWithdrawal
      tags: [wallet]
      summary: Create a withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "201":
          description: Withdrawal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /admin/transactions:
    get:
      operationId: getAdminTransactions
      tags: [admin]
      summary: List all transactions
      responses:
        "200":
          description: Transaction list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTransaction"
  /admin/transactions/{id}/approve:
    patch:
      operationId: approveTransaction
      tags: [admin]
      summary: Approve a pending transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransaction"
  /admin/transactions/{id}/reject:
    patch:
      operationId: rejectTransaction
      tags: [admin]
      summary: Reject a pending transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTransaction"
  /admin/users/{id}:
    get:
      operationId: getAdminUserDetail
      tags: [admin]
      summary: Get detailed info for a single user (holdings, transactions, KYC)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserDetail"
  /admin/kyc:
    get:
      operationId: getAdminKyc
      tags: [admin]
      summary: List all KYC submissions
      responses:
        "200":
          description: KYC list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminKyc"
  /admin/kyc/{id}/approve:
    patch:
      operationId: approveKyc
      tags: [admin]
      summary: Approve a KYC submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated KYC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKyc"
  /admin/kyc/{id}/reject:
    patch:
      operationId: rejectKyc
      tags: [admin]
      summary: Reject a KYC submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated KYC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminKyc"
  /admin/mining-investments:
    get:
      operationId: getAdminMiningInvestments
      tags: [admin]
      summary: List all Mining Place investment requests
      responses:
        "200":
          description: Investment requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminMiningInvestment" }
  /admin/mining-investments/{id}:
    patch:
      operationId: updateAdminMiningInvestment
      tags: [admin]
      summary: Adjust an investment before approval or while active
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMiningInvestmentInput" }
      responses:
        "200":
          description: Updated investment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiningInvestment" }
  /admin/mining-investments/{id}/approve:
    post:
      operationId: approveMiningInvestment
      tags: [admin]
      summary: Approve and settle a pending investment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Active investment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiningInvestment" }
  /admin/mining-investments/{id}/reject:
    post:
      operationId: rejectMiningInvestment
      tags: [admin]
      summary: Reject a pending investment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMiningInvestmentInput" }
      responses:
        "200":
          description: Rejected investment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MiningInvestment" }
  /support/messages:
    get:
      operationId: getSupportMessages
      tags: [support]
      summary: Get all messages in the current user's support thread
      responses:
        "200":
          description: Support thread messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportMessages" }
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a message to support (creates thread if none exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendSupportMessageInput" }
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendSupportMessageResult" }
  /admin/support:
    get:
      operationId: getAdminSupport
      tags: [admin]
      summary: List all user support threads with latest message and unread count
      responses:
        "200":
          description: Support thread list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSupportList" }
  /admin/support/{userId}:
    get:
      operationId: getAdminSupportThread
      tags: [admin]
      summary: Get all messages in a specific user's support thread
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: User support thread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSupportDetail" }
  /admin/support/{userId}/reply:
    post:
      operationId: adminSupportReply
      tags: [admin]
      summary: Send an admin reply to a user's support thread
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSupportReplyInput" }
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSupportReplyResult" }
  /trading/account:
    get:
      operationId: getTradingAccount
      tags: [trading]
      summary: Get the current user's demo trading account
      responses:
        "200":
          description: Trading account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradingAccount" }
  /trading/trades:
    get:
      operationId: getTrades
      tags: [trading]
      summary: Get trade history (auto-settles any expired active trades)
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trade" }
    post:
      operationId: placeTrade
      tags: [trading]
      summary: Place a new long or short trade
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceTradeInput" }
      responses:
        "200":
          description: Trade placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceTradeResult" }
  /admin/trading/trades:
    get:
      operationId: getAdminTrades
      tags: [admin]
      summary: List all trades across all users
      responses:
        "200":
          description: All trades
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminTrade" }
  /admin/trading/stats:
    get:
      operationId: getAdminTradingStats
      tags: [admin]
      summary: Aggregate trading statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTradingStats" }
  /admin/trading/trades/{id}/outcome:
    patch:
      operationId: setTradeOutcome
      tags: [admin]
      summary: Override a trade outcome to win or loss
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTradeOverrideInput" }
      responses:
        "200":
          description: Override applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTrade" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MarketAsset:
      type: object
      required: [symbol, name, price, change24h, marketCap, volume24h, rank]
      properties:
        symbol: { type: string }
        name: { type: string }
        price: { type: number }
        change24h: { type: number }
        marketCap: { type: number }
        volume24h: { type: number }
        rank: { type: number }
        color: { type: string }
    ChartPoint:
      type: object
      required: [time, value]
      properties:
        time: { type: string }
        value: { type: number }
    MarketDetail:
      type: object
      required: [asset, chart]
      properties:
        asset: { $ref: "#/components/schemas/MarketAsset" }
        chart:
          type: array
          items: { $ref: "#/components/schemas/ChartPoint" }
    MiningPlaceAsset:
      type: object
      required: [symbol, name, category, price, change24h, currency, unit, status, updatedAt, color]
      properties:
        symbol: { type: string }
        name: { type: string }
        category: { type: string, enum: [gold, energy, stock, oil] }
        price: { type: number }
        change24h: { type: number }
        currency: { type: string }
        unit: { type: string }
        status: { type: string, enum: [live, stale, fallback] }
        updatedAt: { type: string }
        color: { type: string }
    MiningPlaceSummary:
      type: object
      required: [assets, updatedAt]
      properties:
        assets:
          type: array
          items: { $ref: "#/components/schemas/MiningPlaceAsset" }
        updatedAt: { type: string }
    CreateMiningInvestmentInput:
      type: object
      required: [symbol, amount]
      properties:
        symbol: { type: string, enum: [GOLD, XLE, OIL, AAPL, TSLA, NVDA, MSFT, AMZN] }
        amount: { type: number, exclusiveMinimum: 0 }
    UpdateMiningInvestmentInput:
      type: object
      properties:
        approvedAmount: { type: number, exclusiveMinimum: 0 }
        currentValue: { type: number, minimum: 0 }
        adminNote: { type: string, maxLength: 1000 }
    MiningInvestment:
      type: object
      required: [id, symbol, assetName, category, requestedAmount, entryPrice, currentValue, gainLoss, status, adminNote, createdAt, updatedAt]
      properties:
        id: { type: string }
        symbol: { type: string }
        assetName: { type: string }
        category: { type: string, enum: [gold, energy, stock, oil] }
        requestedAmount: { type: number }
        approvedAmount: { type: [number, "null"] }
        units: { type: [number, "null"] }
        entryPrice: { type: number }
        currentValue: { type: number }
        gainLoss: { type: number }
        status: { type: string, enum: [pending, active, rejected] }
        adminNote: { type: string }
        createdAt: { type: string }
        reviewedAt: { type: [string, "null"] }
        updatedAt: { type: string }
    MiningInvestmentList:
      type: object
      required: [investments, availableUsdc]
      properties:
        investments:
          type: array
          items: { $ref: "#/components/schemas/MiningInvestment" }
        availableUsdc: { type: number }
    AdminMiningInvestment:
      allOf:
        - { $ref: "#/components/schemas/MiningInvestment" }
        - type: object
          required: [clerkUserId, displayName, email]
          properties:
            clerkUserId: { type: string }
            displayName: { type: string }
            email: { type: string }
    Profile:
      type: object
      required: [id, name, email, initials, verificationStatus, twoFactorEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        initials: { type: string }
        verificationStatus: { type: string, enum: [unverified, pending, verified, rejected] }
        twoFactorEnabled: { type: boolean }
        smsPhoneNumber: { type: string, nullable: true }
        smsPhoneVerified: { type: boolean }
    TradingAccount:
      type: object
      required: [balance, totalTrades, wins, losses]
      properties:
        balance: { type: number }
        totalTrades: { type: number }
        wins: { type: number }
        losses: { type: number }
    Trade:
      type: object
      required: [id, asset, direction, amount, timeframeSecs, status, entryPrice, payoutRate, createdAt, expiresAt]
      properties:
        id: { type: number }
        asset: { type: string }
        direction: { type: string }
        amount: { type: number }
        timeframeSecs: { type: number }
        status: { type: string }
        result: { type: string, nullable: true }
        adminOverride: { type: string, nullable: true }
        entryPrice: { type: number }
        exitPrice: { type: number, nullable: true }
        payout: { type: number, nullable: true }
