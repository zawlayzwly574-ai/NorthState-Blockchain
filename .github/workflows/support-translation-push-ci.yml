name: Support translation and Web Push validation

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/admin-panel/**"
      - "artifacts/blockchain-hub/**"
      - "lib/db/**"
      - "package.json"
      - "artifacts/*/package.json"
      - "lib/*/package.json"
      - ".github/workflows/support-translation-push-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install
      - name: Typecheck workspace
        run: npm run typecheck
      - name: Build API server
        run: npm run build --workspace=@workspace/api-server
      - name: Run API tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: npm test --workspace=@workspace/api-server
