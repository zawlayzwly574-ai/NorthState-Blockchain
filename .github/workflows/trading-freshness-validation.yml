name: Temporary Trading freshness validation

on:
  push:
    branches:
      - "verify/trading-source-timestamp-build"

permissions:
  contents: read

jobs:
  trading-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Blockchain Hub
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          VITE_API_BASE_URL: https://workspaceapi-server-production-838d.up.railway.app
        run: pnpm --filter @workspace/blockchain-hub run build
