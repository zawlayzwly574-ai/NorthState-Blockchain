name: Temporary preview market API smoke check # verify Canton and Toncoin aliases

on:
  push:
    branches:
      - "verify/market-api-smoke"

permissions:
  contents: read

jobs:
  market-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public markets endpoint returns the supported asset list
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 20 -H 'Accept: application/json' -o "$response_file" -w '%{http_code}' 'https://workspaceapi-server-northstate-blockchain-pr-6.up.railway.app/api/markets')"
          echo "http_status=$status"
          if [ "$status" != "200" ]; then
            echo "Market API returned HTTP $status" >&2
            head -c 1000 "$response_file" >&2 || true
            exit 1
          fi
          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(body) || body.length === 0) {
            console.error('Expected a non-empty array of supported market assets.');
            process.exit(1);
          }
          const quoteAvailable = body.filter((item) => Number.isFinite(item.price) && item.price > 0);
          console.log(JSON.stringify({
            assetCount: body.length,
            quotesAvailable: quoteAvailable.length,
            quotesUnavailable: body.length - quoteAvailable.length,
            firstAssets: body.slice(0, 8).map(({ symbol, name, price }) => ({ symbol, name, price })),
            missingAssets: body.filter((item) => !(Number.isFinite(item.price) && item.price > 0)).map(({ symbol, name }) => ({ symbol, name })),
          }, null, 2));
          if (quoteAvailable.length === 0) {
            console.error('No live market quotes returned from the preview API.');
            process.exit(1);
          }
          NODE

      - name: Inspect missing quote symbols against public providers
        shell: bash
        run: |
          set -euo pipefail
          paprika_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.coinpaprika.com/v1/tickers?quotes=USD' -o "$paprika_file"
          node - "$paprika_file" <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const relevant = rows.filter((t) =>
            ['CANTON', 'CC', 'TON', 'TONCOIN'].includes(String(t.symbol ?? '').toUpperCase()) ||
            /canton|toncoin|the open network/i.test(String(t.name ?? ''))
          ).map((t) => ({
            id: t.id,
            name: t.name,
            symbol: t.symbol,
            rank: t.rank,
            usd: t.quotes?.USD?.price,
            marketCap: t.quotes?.USD?.market_cap,
          }));
          console.log('CoinPaprika matching tickers:');
          console.log(JSON.stringify({ totalTickers: rows.length, relevant }, null, 2));
          NODE

          kraken_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.kraken.com/0/public/AssetPairs' -o "$kraken_file"
          node - "$kraken_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const pairs = Object.entries(payload.result ?? {}).filter(([key, p]) =>
            /^(TON|CC)/i.test(String(p.base ?? '')) ||
            /^(TONUSD|CCUSD|TON\/USD|CC\/USD)/i.test(String(p.altname ?? p.wsname ?? key))
          ).map(([key, p]) => ({
            key,
            altname: p.altname,
            wsname: p.wsname,
            base: p.base,
            quote: p.quote,
          }));
          console.log('Kraken matching asset pairs:');
          console.log(JSON.stringify({ errors: payload.error, pairs }, null, 2));
          NODE
