name: Temporary production market API smoke check # verify all live quotes

on:
  push:
    branches:
      - "verify/market-api-smoke"

permissions:
  contents: read

jobs:
  market-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public markets endpoint returns the supported asset list
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl -sS --max-time 20 -H 'Accept: application/json' -o "$response_file" -w '%{http_code}' 'https://workspaceapi-server-production-838d.up.railway.app/api/markets')"
          echo "http_status=$status"
          if [ "$status" != "200" ]; then
            echo "Market API returned HTTP $status" >&2
            head -c 1000 "$response_file" >&2 || true
            exit 1
          fi
          node - "$response_file" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const body = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(body) || body.length === 0) {
            console.error('Expected a non-empty array of supported market assets.');
            process.exit(1);
          }
          const quoteAvailable = body.filter((item) => Number.isFinite(item.price) && item.price > 0);
          console.log(JSON.stringify({
            assetCount: body.length,
            quotesAvailable: quoteAvailable.length,
            quotesUnavailable: body.length - quoteAvailable.length,
            firstAssets: body.slice(0, 8).map(({ symbol, name, price }) => ({ symbol, name, price })),
            missingAssets: body.filter((item) => !(Number.isFinite(item.price) && item.price > 0)).map(({ symbol, name }) => ({ symbol, name })),
          }, null, 2));
          if (quoteAvailable.length === 0) {
            console.error('No live market quotes returned from the preview API.');
            process.exit(1);
          }
          NODE

      - name: Inspect missing quote symbols against public providers
        shell: bash
        run: |
          set -euo pipefail
          paprika_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.coinpaprika.com/v1/tickers?quotes=USD' -o "$paprika_file"
          node - "$paprika_file" <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const relevant = rows.filter((t) =>
            ['CANTON', 'CC', 'TON', 'TONCOIN'].includes(String(t.symbol ?? '').toUpperCase()) ||
            /canton|toncoin|the open network/i.test(String(t.name ?? ''))
          ).map((t) => ({
            id: t.id,
            name: t.name,
            symbol: t.symbol,
            rank: t.rank,
            usd: t.quotes?.USD?.price,
            marketCap: t.quotes?.USD?.market_cap,
          }));
          console.log('CoinPaprika matching tickers:');
          console.log(JSON.stringify({ totalTickers: rows.length, relevant }, null, 2));
          NODE

          kraken_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.kraken.com/0/public/AssetPairs' -o "$kraken_file"
          node - "$kraken_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const pairs = Object.entries(payload.result ?? {}).filter(([key, p]) =>
            /^(TON|CC)/i.test(String(p.base ?? '')) ||
            /^(TONUSD|CCUSD|TON\/USD|CC\/USD)/i.test(String(p.altname ?? p.wsname ?? key))
          ).map(([key, p]) => ({
            key,
            altname: p.altname,
            wsname: p.wsname,
            base: p.base,
            quote: p.quote,
          }));
          console.log('Kraken matching asset pairs:');
          console.log(JSON.stringify({ errors: payload.error, pairs }, null, 2));
          NODE

      - name: Probe live quote providers and source timestamps
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const urls = [
            ["coinpaprika", "https://api.coinpaprika.com/v1/tickers?quotes=USD"],
            ["okx-btc", "https://www.okx.com/api/v5/market/ticker?instId=BTC-USDT"],
            ["okx-ton", "https://www.okx.com/api/v5/market/ticker?instId=TON-USDT"],
            ["coinbase-btc", "https://api.exchange.coinbase.com/products/BTC-USD/ticker"],
            ["kraken-btc-trades", "https://api.kraken.com/0/public/Trades?pair=XBTUSD"],
            ["binance-btc-trades", "https://api.binance.com/api/v3/trades?symbol=BTCUSDT&limit=1"],
          ];
          const timeout = AbortSignal.timeout(12000);
          const result = await Promise.all(urls.map(async ([name, url]) => {
            try {
              const response = await fetch(url, { headers: { accept: "application/json", "user-agent": "NorthStateBlockchain/1.0" }, signal: timeout });
              const body = await response.json().catch(() => null);
              if (name === "coinpaprika" && Array.isArray(body)) {
                const selected = body.filter((t) => ["BTC","ETH","BNB","TON","GRAM","CC"].includes(String(t.symbol).toUpperCase()))
                  .slice(0, 12).map((t) => ({
                    name:t.name,symbol:t.symbol,updatedAt:t.last_updated,
                    usd:t.quotes?.USD?.price,quoteUpdatedAt:t.quotes?.USD?.last_updated,
                  }));
                return { name,status:response.status,count:body.length,selected };
              }
              if (name.startsWith("okx")) {
                return {name,status:response.status,code:body?.code,data:(body?.data??[]).slice(0,1).map(x=>({instId:x.instId,last:x.last,ts:x.ts,open24h:x.open24h}))};
              }
              if (name === "coinbase-btc") return {name,status:response.status,price:body?.price,time:body?.time};
              if (name === "kraken-btc-trades") return {name,status:response.status,error:body?.error,latest:(Object.values(body?.result??{})[0]??[]).slice(-1)};
              return {name,status:response.status,body};
            } catch (error) { return {name,error:String(error)}; }
          }));
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Count live exchange ticker coverage for supported trading assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = ["BTC","ETH","USDT","BNB","USDC","DAI","FDUSD","XRP","SOL","TRX","HYPE","ZEC","DOGE","LEO","XMR","LINK","ADA","XLM","BCH","CANTON","USD1","USDE","LTC","TON","HBAR","AVAX","SUI","SHIB","UNI","PYUSD","CRO","XAUT","TAO","NEAR","M"];
          const urls = [
            ["okx","https://www.okx.com/api/v5/market/tickers?instType=SPOT"],
            ["gate","https://api.gateio.ws/api/v4/spot/tickers"],
            ["kucoin","https://api.kucoin.com/api/v1/market/allTickers"],
            ["bybit","https://api.bybit.com/v5/market/tickers?category=spot"],
          ];
          const out = await Promise.all(urls.map(async ([provider,url]) => {
            try {
              const response = await fetch(url,{headers:{accept:"application/json","user-agent":"NorthStateBlockchain/1.0"},signal:AbortSignal.timeout(15000)});
              const payload = await response.json().catch(()=>null);
              let rows=[];
              if(provider==="okx") rows=(payload?.data??[]).map(x=>({symbol:String(x.instId??"").split("-")[0].toUpperCase(),pair:x.instId,price:x.last,ts:x.ts}));
              if(provider==="gate") rows=(Array.isArray(payload)?payload:[]).map(x=>({symbol:String(x.currency_pair??"").split("_")[0].toUpperCase(),pair:x.currency_pair,price:x.last,ts:x.update}));
              if(provider==="kucoin") rows=(payload?.data?.ticker??[]).map(x=>({symbol:String(x.symbol??"").split("-")[0].toUpperCase(),pair:x.symbol,price:x.last,ts:x.time}));
              if(provider==="bybit") rows=(payload?.result?.list??[]).map(x=>({symbol:String(x.symbol??"").replace(/USDT$/,"").toUpperCase(),pair:x.symbol,price:x.lastPrice,ts:x.time??payload?.time}));
              const aliases={CANTON:["CC"],TON:["GRAM"],XAUT:["XAUT"],USDE:["USDE"],USD1:["USD1"],PYUSD:["PYUSD"],FDUSD:["FDUSD"]};
              const found=expected.map(symbol=> {
                const candidates=rows.filter(x=>([symbol,...(aliases[symbol]??[])].includes(x.symbol)) && Number(x.price)>0);
                const quotePairs=candidates.filter(x=>/[-_](USDT|USD|USDC)$/.test(x.pair));
                const c=quotePairs[0]??candidates[0];
                return c?{symbol,pair:c.pair,price:c.price,ts:c.ts}:null;
              }).filter(Boolean);
              return {provider,status:response.status,count:rows.length,matched:found.length,missing:expected.filter(s=>!found.some(x=>x.symbol===s)),examples:found.slice(0,8)};
            } catch(e) {return {provider,error:String(e)};}
          }));
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Inspect timestamped exchange quotes for Trading asset coverage
        shell: bash
        run: |
          set -euo pipefail
          targets='["BTC","ETH","XAUT","HYPE","LEO","XMR","CANTON","CC","TON","GRAM","USD1","USDE","XAUT"]'
          okx_file="$(mktemp)"
          curl -sS --max-time 25 'https://www.okx.com/api/v5/market/tickers?instType=SPOT' -o "$okx_file"
          node - "$okx_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const targets = new Set(['BTC','ETH','XAUT','HYPE','LEO','XMR','CANTON','CC','TON','GRAM','USD1','USDE']);
          const pairs = (payload.data ?? []).filter((r) => targets.has(String(r.instId ?? '').split('-')[0].toUpperCase()) && /-(USDT|USDC|USD)$/.test(String(r.instId ?? '')));
          console.log('OKX direct timestamped ticker candidates:');
          console.log(JSON.stringify({code:payload.code,count:pairs.length,pairs:pairs.map(({instId,last,ts,volCcy24h})=>({instId,last,ts,ageMs:Date.now()-Number(ts),volCcy24h}))}, null, 2));
          NODE

          kucoin_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.kucoin.com/api/v1/market/allTickers' -o "$kucoin_file"
          node - "$kucoin_file" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const targets = new Set(['BTC','ETH','XAUT','HYPE','LEO','XMR','CANTON','CC','TON','GRAM','USD1','USDE']);
          const pairs = (payload.data?.ticker ?? []).filter((r) => targets.has(String(r.symbol ?? '').split('-')[0].toUpperCase()) && /-(USDT|USDC|USD)$/.test(String(r.symbol ?? '')));
          console.log('KuCoin provider-time ticker candidates:');
          console.log(JSON.stringify({code:payload.code,sourceAt:payload.data?.time,ageMs:Date.now()-Number(payload.data?.time),count:pairs.length,pairs:pairs.map(({symbol,last,changeRate,volValue})=>({symbol,last,changeRate,volValue}))}, null, 2));
          NODE

          gate_file="$(mktemp)"
          curl -sS --max-time 25 'https://api.gateio.ws/api/v4/spot/tickers' -o "$gate_file"
          node - "$gate_file" <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const targets = new Set(['BTC','ETH','XAUT','HYPE','LEO','XMR','CANTON','CC','TON','GRAM','USD1','USDE']);
          const pairs = rows.filter((r) => targets.has(String(r.currency_pair ?? '').split('_')[0].toUpperCase()) && /_(USDT|USDC|USD)$/.test(String(r.currency_pair ?? '')));
          console.log('Gate.io display ticker candidates (not used as executable quotes without timestamps):');
          console.log(JSON.stringify({count:pairs.length,pairs:pairs.map(({currency_pair,last,change_percentage,quote_volume})=>({currency_pair,last,change_percentage,quote_volume}))}, null, 2));
          NODE
