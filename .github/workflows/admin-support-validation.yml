name: Temporary admin support validation

on:
  push:
    branches:
      - "verify/admin-support-build"

permissions:
  contents: read

jobs:
  support-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck Admin Panel
        run: pnpm --filter @workspace/admin-panel run typecheck
      - name: Build Admin Panel
        run: pnpm --filter @workspace/admin-panel run build
      - name: Build API Server
        run: pnpm --filter @workspace/api-server run build
