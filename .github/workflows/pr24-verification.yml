name: PR24 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/complete-localization-and-inapp-guest-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr24-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: Typecheck and build workspace
        env:
          # Vite configs require PORT even during static production builds.
          PORT: 3000
          BASE_PATH: "/"
          # Build-only placeholder: CI verifies compilation and does not deploy this artifact.
          # Production Clerk keys remain configured in the deployment environment.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: npm run build

  api-tests:
    name: API automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        env:
          # Tests mock database calls; this placeholder only permits the DB module to initialize.
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/northstate_test
        run: npm test --workspace=@workspace/api-server
