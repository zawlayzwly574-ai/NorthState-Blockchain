name: PR24 verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/complete-localization-and-inapp-guest-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr24-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-checks:
    name: User App typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck User App
        run: npm run typecheck --workspace=@workspace/blockchain-hub

      - name: Build User App
        env:
          PORT: 3000
          BASE_PATH: "/"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: npm run build --workspace=@workspace/blockchain-hub

  api-tests:
    name: API build and automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install --legacy-peer-deps

      - name: Build API server
        run: npm run build --workspace=@workspace/api-server

      - name: Run API tests
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/northstate_test
        run: npm run test --workspace=@workspace/api-server
