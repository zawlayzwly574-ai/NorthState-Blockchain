name: Temporary live market feed discovery

on:
  push:
    branches:
      - "verify/live-feed-discovery"

permissions:
  contents: read

jobs:
  discover-live-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect supported CoinPaprika streaming assets
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 20 'https://live.coinpaprika.com/assets' -o /tmp/assets.json
          node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('/tmp/assets.json', 'utf8'));
          const wanted = ['BTC','ETH','USDT','BNB','USDC','DAI','FDUSD','XRP','SOL','TRX','HYPE','ZEC','DOGE','LEO','XMR','LINK','ADA','XLM','BCH','CC','CANTON','USD1','USDE','LTC','GRAM','TON','HBAR','AVAX','SUI','SHIB','UNI','PYUSD','CRO','XAUT','TAO','NEAR','M'];
          const assets = Array.isArray(body.assets) ? body.assets : [];
          const names = assets.map((x) => typeof x === 'string' ? x : x.asset);
          const supported = wanted.filter((x) => names.includes(x));
          const unsupported = wanted.filter((x) => !names.includes(x));
          console.log(JSON.stringify({count: body.count, wanted, supported, unsupported, sample: assets.slice(0, 20)}, null, 2));
          NODE
      - name: Verify streaming ticks update over time
        shell: bash
        run: |
          set -euo pipefail
          set +e
          curl -sS --max-time 8 'https://live.coinpaprika.com/stream?asset=BTC,ETH,SOL&interval=1s&limit=20' -o /tmp/stream.txt
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ] && [ "$curl_status" -ne 28 ]; then
            echo "Streaming endpoint failed with curl status $curl_status" >&2
            exit "$curl_status"
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('/tmp/stream.txt', 'utf8').split(/\r?\n/).filter((line) => line.startsWith('data:'));
          const rows = lines.map((line) => { try { return JSON.parse(line.slice(5).trim()); } catch { return null; } }).filter(Boolean);
          console.log(JSON.stringify({
            eventCount: rows.length,
            assets: [...new Set(rows.map((x) => x.asset ?? x.pair?.Base))],
            sample: rows.slice(0, 12),
            oldestTimestamp: rows.map((x) => Date.parse(x.timestamp)).filter(Number.isFinite).sort((a,b)=>a-b)[0] ?? null,
            newestTimestamp: rows.map((x) => Date.parse(x.timestamp)).filter(Number.isFinite).sort((a,b)=>b-a)[0] ?? null,
          }, null, 2));
          NODE

      - name: Discover exchange pairs for assets without aggregator streaming
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 20 'https://api.kraken.com/0/public/AssetPairs' -o /tmp/pairs.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/pairs.json', 'utf8'));
          const wanted = ['FDUSD','LEO','CC','TON','PYUSD','XAUT','TAO','NEAR','M','USD1','USDE','HYPE','ZEC','TRX','CRO'];
          const rows = Object.entries(payload.result ?? {}).filter(([key, p]) => {
            const base = String(p.base ?? '').toUpperCase().replace(/^X(?=[A-Z])/, '').replace(/^Z(?=[A-Z])/, '');
            const name = String(p.wsname ?? p.altname ?? key).toUpperCase();
            return wanted.some((symbol) => base === symbol || name.startsWith(symbol + '/') || name.startsWith(symbol + 'USD') || name.startsWith(symbol + 'USDT'));
          }).map(([key,p]) => ({key,altname:p.altname,wsname:p.wsname,base:p.base,quote:p.quote}));
          console.log(JSON.stringify({errors: payload.error, pairs: rows}, null, 2));
          NODE

      - name: Check real-time trade endpoints for assets not in the aggregate stream
        shell: bash
        run: |
          set -euo pipefail
          for symbol in FDUSDUSDT LEOUSDT; do
            file="/tmp/bybit-${symbol}.json"
            status="$(curl -sS --max-time 10 -o "$file" -w '%{http_code}' "https://api.bybit.com/v5/market/recent-trade?category=spot&symbol=${symbol}&limit=1" || true)"
            echo "Bybit ${symbol} HTTP ${status}"
            node - "$file" <<'NODE'
          const fs = require('node:fs');
          try {
            const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            console.log(JSON.stringify({retCode:body.retCode,retMsg:body.retMsg,result:body.result?.list?.slice(0,1)},null,2));
          } catch (error) { console.log(String(error)); }
          NODE
          done

          for pair in tLEOUSD tFDUSD:USD; do
            file="/tmp/bitfinex-${pair//:/-}.json"
            status="$(curl -sS --max-time 10 -o "$file" -w '%{http_code}' "https://api-pub.bitfinex.com/v2/trades/${pair}/hist?limit=1" || true)"
            echo "Bitfinex ${pair} HTTP ${status}"
            node - "$file" <<'NODE'
          const fs = require('node:fs');
          try {
            const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
            console.log(JSON.stringify({sample:Array.isArray(body)?body.slice(0,1):body},null,2));
          } catch (error) { console.log(String(error)); }
          NODE
          done

      - name: Probe extra public exchange feeds for FDUSD and LEO
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://www.okx.com/api/v5/market/trades?instId=FDUSD-USDT&limit=1'
            'https://www.okx.com/api/v5/market/trades?instId=FDUSD-USD&limit=1'
            'https://api.kucoin.com/api/v1/market/histories?symbol=FDUSD-USDT'
            'https://api.bitget.com/api/v2/spot/market/fills?symbol=FDUSDUSDT&limit=1'
            'https://min-api.cryptocompare.com/data/price?fsym=FDUSD&tsyms=USD'
            'https://min-api.cryptocompare.com/data/price?fsym=LEO&tsyms=USD'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            file="/tmp/market-extra-${n}.json"
            status="$(curl -sS --max-time 10 -A 'Mozilla/5.0 NorthStateBlockchain/1.0' -o "$file" -w '%{http_code}' "$url" || true)"
            echo "endpoint_${n} HTTP ${status} URL ${url}"
            head -c 1000 "$file" || true
            echo
          done

      - name: Check other public exchange trade endpoints for FDUSD
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://api.mexc.com/api/v3/trades?symbol=FDUSDUSDT&limit=1'
            'https://api.gateio.ws/api/v4/spot/trades?currency_pair=FDUSD_USDT&limit=1'
            'https://api.mexc.com/api/v3/trades?symbol=FDUSDUSDC&limit=1'
            'https://api.binance.vision/api/v3/trades?symbol=FDUSDUSDT&limit=1'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            file="/tmp/fdusd-extra-${n}.json"
            status="$(curl -sS --max-time 10 -o "$file" -w '%{http_code}' "$url" || true)"
            echo "endpoint_${n} HTTP ${status} URL ${url}"
            head -c 1000 "$file" || true
            echo
          done

      - name: Verify remaining public pair identities and FDUSD markets
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://api.kraken.com/0/public/Trades?pair=MUSD'
            'https://api.exchange.coinbase.com/products/FDUSD-USD/ticker'
            'https://api.exchange.coinbase.com/products/FDUSD-USDT/ticker'
            'https://api.gateio.ws/api/v4/spot/trades?currency_pair=FDUSD_USDT&limit=1'
            'https://api.mexc.com/api/v3/trades?symbol=FDUSDUSDT&limit=1'
            'https://api-pub.bitfinex.com/v2/trades/tFDUSD:UST/hist?limit=1'
            'https://api-pub.bitfinex.com/v2/trades/tFDUSD:USDT/hist?limit=1'
          )
          n=0
          for url in "${urls[@]}"; do
            n=$((n+1))
            file="/tmp/last-provider-${n}.json"
            status="$(curl -sS --max-time 10 -A 'Mozilla/5.0 NorthStateBlockchain/1.0' -o "$file" -w '%{http_code}' "$url" || true)"
            echo "endpoint_${n} HTTP ${status} URL ${url}"
            head -c 650 "$file" || true
            echo
          done
          curl -sS --max-time 20 'https://api.coinpaprika.com/v1/tickers?quotes=USD' -o /tmp/cp-tickers.json
          node <<'NODE'
          const fs = require('node:fs');
          const rows = JSON.parse(fs.readFileSync('/tmp/cp-tickers.json','utf8'));
          console.log('CoinPaprika M / MemeCore candidates:',JSON.stringify(rows.filter(x=>String(x.symbol).toUpperCase()==='M' || /memecore/i.test(String(x.name))).map(x=>({id:x.id,name:x.name,symbol:x.symbol,price:x.quotes?.USD?.price,last_updated:x.last_updated})),null,2));
          NODE
